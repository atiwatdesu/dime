<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: calm money tool, broker-statement precision
   IDEA: a brokerage ledger card — each stock a slip, its lots underneath
   PICTURE: the live holdings list itself, under a mint field holding the total
   COLOUR and TYPE: black/white + mint #b8f5d0; Space Grotesk numbers, IBM Plex Sans Thai text
   LAYOUT: mint total field | allocation bars, then holdings slips full width */
:root{color-scheme:light dark;--bg:light-dark(#fff,#0b0b0b);--ink:light-dark(#0b0b0b,#f2f2f2);--mut:light-dark(#5d5d5d,#a3a3a3);--line:light-dark(#e4e4e4,#262626);--card:light-dark(#fff,#141414);--mint:#b8f5d0;--mintink:light-dark(#0b0b0b,#b8f5d0);--field:light-dark(#b8f5d0,#0b0b0b);--up:light-dark(#0a7a43,#6ee6a2);--dn:light-dark(#c62f2a,#ff8a80);--soft:light-dark(#f4f4f2,#1b1b1b)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans Thai",system-ui,sans-serif;overflow-x:clip}
.n,h1,.big{font-family:"Space Grotesk","IBM Plex Sans Thai",sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(4vw,16px)}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:18px 0}
h1{font-size:32px;line-height:1.05;margin:0;font-weight:700}
.sub{color:var(--mut);font-size:13px}
button,.btn{font:inherit;font-size:15px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--ink);background:var(--bg);color:var(--ink);cursor:pointer}
button.pri{background:var(--ink);color:var(--bg)}button.ghost{border-color:var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #3dbf7a;outline-offset:2px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.top{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);border-block:1px solid var(--line)}
.tot{background:var(--field);color:var(--mintink);padding:clamp(24px,4vw,48px)}
:root:not([data-theme=light]) .tot{border-inline-end:1px solid var(--line)}
.big{font-size:clamp(36px,6vw,52px);line-height:1.05;font-weight:700;white-space:nowrap}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-top:22px}
.kv div span{display:block;font-size:13px;opacity:.75}.kv b{font-size:17px;white-space:nowrap}
.alloc{padding:clamp(24px,4vw,48px)}
.alloc h2,.sec h2{font-size:17px;margin:0 0 14px;font-weight:600}
.bar{display:grid;grid-template-columns:64px minmax(0,1fr) 56px;gap:10px;align-items:center;font-size:14px;margin-bottom:9px}
.bar i{display:block;height:14px;background:var(--soft);border-radius:4px;overflow:hidden}.bar i b{display:block;height:100%;background:var(--ink)}
.bar .n:last-child{text-align:right}
.sec{padding:28px 0}
.slip{border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:12px}
.row{display:grid;grid-template-columns:minmax(90px,1.1fr) repeat(4,minmax(0,1fr)) auto;gap:12px;align-items:center;padding:16px 18px}
.sym{font:700 22px "Space Grotesk",sans-serif}.row small{display:block;color:var(--mut);font-size:13px}
.row .n{font-size:17px;white-space:nowrap}.up{color:var(--up)}.dn{color:var(--dn)}
.pl{text-align:right}.pl .n{font-size:22px;font-weight:700}
.row .acts button{min-height:40px;padding:0 12px;font-size:14px}
.lnk{background:none;border:0;padding:0;min-height:0;color:var(--mut);text-decoration:underline;font-size:13px}
.det{border-top:1px solid var(--line);padding:6px 18px 16px}
table{width:100%;border-collapse:collapse;font-size:14px}th{font-weight:500;color:var(--mut);text-align:start;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:9px 6px;border-bottom:1px solid var(--line)}td.r,th.r{text-align:right;white-space:nowrap}
.tag{display:inline-block;padding:1px 8px;border-radius:6px;font-size:12px;font-weight:600}.tag.b{background:var(--mint);color:#0b0b0b}.tag.s{background:var(--ink);color:var(--bg)}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:40px 20px;text-align:center;color:var(--mut)}
.note{font-size:13px;color:var(--mut);margin:8px 0}
.ov{position:fixed;inset:0;background:rgb(0 0 0/.45);display:none;align-items:flex-start;justify-content:center;padding:5vh 12px;overflow:auto;z-index:9}
.ov.on{display:flex}.md{background:var(--bg);color:var(--ink);border-radius:16px;width:min(560px,100%);padding:22px;border:1px solid var(--line)}
.md h3{margin:0 0 14px;font-size:20px}.md.wide{width:min(860px,100%)}
.f{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.f label{font-size:13px;color:var(--mut)}
input,select{font:inherit;font-size:16px;width:100%;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.seg button{flex:1;border:0;border-radius:0}.seg button.on{background:var(--ink);color:var(--bg)}
.res{background:var(--field);color:var(--mintink);border-radius:12px;padding:16px;margin:14px 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
:root:not([data-theme=light]) .res{border:1px solid var(--mint)}
.res span{display:block;font-size:13px;opacity:.75}.res b{font:700 20px "Space Grotesk",sans-serif;white-space:nowrap}
.res .hero{grid-column:1/-1}.res .hero b{font-size:30px}
.mf{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.err{color:var(--dn);font-size:14px}
.scroll{overflow-x:auto}
@media(max-width:820px){.row{grid-template-columns:repeat(2,minmax(0,1fr))}.row .acts{grid-column:1/-1}.pl{text-align:start}}
@media(max-width:600px){.top{grid-template-columns:1fr}.f,.res{grid-template-columns:1fr}table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;color:var(--mut)}.stack td:empty{display:none}}
@media(prefers-reduced-motion:no-preference){.det{animation:dn .2s ease-out}@keyframes dn{from{opacity:0;transform:translateY(-4px)}}}
</style><script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script></head>
<body>
<div class="wrap"><header>
<div><h1>Portfolio</h1><div class="sub" id="stamp">กำลังโหลดข้อมูล…</div></div>
<div class="acts" id="topActs" hidden><button class="pri" id="bAdd">+ บันทึกรายการ</button><button id="bPdf">นำเข้า PDF</button><button class="ghost" id="bSet">ตั้งค่า</button></div>
</header></div>
<section class="top"><div class="tot" id="tot"></div><div class="alloc" id="alloc"></div></section>
<div class="wrap"><section class="sec"><h2>หุ้นที่ถืออยู่</h2><div id="list"></div></section><section class="sec" id="closedSec" hidden><h2>ขายหมดแล้ว</h2><div id="closed"></div></section></div>
<div class="ov" id="ov"><div class="md" id="md"></div></div>
<input type="file" id="pdfIn" accept="application/pdf" hidden><input type="file" id="jsonIn" accept="application/json,.json" hidden>
<script type="module">
import {firebaseConfig} from './config.js';
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,collection,doc,setDoc,deleteDoc,onSnapshot,writeBatch} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

{
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const x=parseFloat(String(v??'').replace(/,/g,''));return isFinite(x)?x:NaN};
const usd=(x,d=2)=>isFinite(x)?(x<0?'−$':'$')+Math.abs(x).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}):'—';
const sgn=(x,d=2)=>isFinite(x)?(x>0?'+':x<0?'−':'')+'$'+Math.abs(x).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}):'—';
const pct=x=>isFinite(x)?(x>0?'+':x<0?'−':'')+Math.abs(x*100).toFixed(2)+'%':'—';
const qf=x=>isFinite(x)?(+x.toFixed(6)).toLocaleString('en-US',{maximumFractionDigits:6}):'—';
const thb=x=>isFinite(x)?'฿'+Math.round(x).toLocaleString('en-US'):'—';
const cls=x=>x>0?'up':x<0?'dn':'';
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Bangkok'});
const fdt=s=>{try{return new Date(s).toLocaleString('th-TH',{timeZone:'Asia/Bangkok',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}catch(e){return''}};
const EPS=1e-9;
let fs=null,uid=null,autoP={},autoFx=null,ovr={p:{},fx:null},txns=[],prices={p:{},fx:null},settings={method:'fifo'},open=new Set(),ready=false,canWrite=true;

function compute(list,method){
  const by={},ann={};
  [...list].sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.t||0)-(b.t||0)).forEach(x=>(by[x.sym]=by[x.sym]||[]).push(x));
  const out=[];
  for(const sym in by){
    let lots=[],realized=0,bought=0;
    for(const x of by[sym]){
      const q=+x.qty,p=+x.price,fee=+x.fee||0;
      if(x.type==='buy'){
        bought+=q*p+fee;
        const lot={id:x.id,q,c:(q*p+fee)/q,q0:q};
        if(method==='avg'){ann[x.id]={pooled:true};if(lots.length){const L=lots[0],tq=L.q+q;L.c=(L.q*L.c+q*lot.c)/tq;L.q=tq}else lots.push(lot)}
        else{lots.push(lot);ann[x.id]={remain:q,q0:q}}
      }else{
        let need=q,costOut=0;
        while(need>EPS&&lots.length){const L=lots[0],k=Math.min(L.q,need);costOut+=k*L.c;L.q-=k;need-=k;if(ann[L.id]&&!ann[L.id].pooled)ann[L.id].remain=L.q;if(L.q<EPS)lots.shift()}
        const r=(q-need)*p-fee-costOut;realized+=r;ann[x.id]={realized:r,over:need>EPS}
      }
    }
    const qty=lots.reduce((s,L)=>s+L.q,0),cost=lots.reduce((s,L)=>s+L.q*L.c,0);
    out.push({sym,qty:qty<EPS?0:qty,cost,avg:qty>EPS?cost/qty:NaN,realized,tx:by[sym]});
  }
  return{rows:out,ann};
}
const priceOf=s=>{const v=prices.p?.[s];return v&&isFinite(+v.v)?+v.v:NaN};

function render(){
  const {rows,ann}=compute(txns,settings.method);
  const held=rows.filter(r=>r.qty>EPS),closed=rows.filter(r=>r.qty<=EPS);
  held.forEach(r=>{r.px=priceOf(r.sym);r.val=r.qty*r.px;r.pl=r.val-r.cost;r.plp=r.pl/r.cost});
  held.sort((a,b)=>(isFinite(b.val)?b.val:b.cost)-(isFinite(a.val)?a.val:a.cost));
  const missing=held.filter(r=>!isFinite(r.px)).length;
  const val=held.reduce((s,r)=>s+(isFinite(r.val)?r.val:r.cost),0),cost=held.reduce((s,r)=>s+r.cost,0),un=val-cost,rz=rows.reduce((s,r)=>s+r.realized,0);
  const fx=+prices.fx?.v;
  $('#stamp').textContent=!ready?'กำลังโหลดข้อมูล…':(prices.at?'ราคาอัปเดต '+fdt(prices.at):'ยังไม่มีการอัปเดตราคา')+(settings.method==='avg'?' · คิดแบบต้นทุนเฉลี่ย':' · คิดแบบ FIFO');
  $('#tot').innerHTML=`<div style="font-size:14px;opacity:.8">มูลค่าพอร์ตรวม</div><div class="big">${usd(val)}</div>
  <div class="n" style="font-size:20px;margin-top:6px">${isFinite(fx)?thb(val*fx)+` <span style="font-size:13px;opacity:.75">ที่ ${fx.toFixed(2)} บาท/USD</span>`:'<span style="font-size:14px;opacity:.75">ยังไม่มีเรต USD/THB</span>'}</div>
  <div class="kv"><div><span>กำไร/ขาดทุน (ยังถือ)</span><b class="n">${sgn(un)} · ${pct(cost?un/cost:NaN)}</b></div><div><span>ต้นทุนรวม</span><b class="n">${usd(cost)}</b></div><div><span>กำไรที่ขายแล้ว</span><b class="n">${sgn(rz)}</b></div></div>
  ${missing?`<p class="note" style="color:inherit">${missing} ตัวยังไม่มีราคา จึงนับที่ราคาทุนไปก่อน</p>`:''}`;
  $('#alloc').innerHTML=`<h2>สัดส่วนในพอร์ต</h2>`+(held.length?held.map(r=>{const v=isFinite(r.val)?r.val:r.cost,w=val?v/val:0;return`<div class="bar"><span class="n">${esc(r.sym)}</span><i><b style="width:${(w*100).toFixed(1)}%"></b></i><span class="n">${(w*100).toFixed(1)}%</span></div>`}).join(''):'<p class="note">เพิ่มรายการซื้อแรก แล้วสัดส่วนจะแสดงที่นี่</p>');
  $('#list').innerHTML=held.length?held.map(r=>slip(r,ann,true)).join(''):`<div class="empty">${ready?'ยังไม่มีหุ้นในพอร์ต<br><br><button class="pri" data-a="add">+ บันทึกรายการซื้อแรก</button>':'กำลังโหลด…'}</div>`;
  $('#closedSec').hidden=!closed.length;
  $('#closed').innerHTML=closed.map(r=>slip(r,ann,false)).join('');
}
function slip(r,ann,isHeld){
  const s=esc(r.sym),o=open.has(r.sym);
  const head=isHeld?`<div class="row"><div><div class="sym">${s}</div><small>${qf(r.qty)} หุ้น</small></div>
  <div><small>ต้นทุนเฉลี่ย</small><span class="n">${usd(r.avg,r.avg<10?4:2)}</span></div>
  <div><small>ราคาปัจจุบัน <button class="lnk" data-a="px" data-s="${s}">แก้</button></small><span class="n">${usd(r.px)}</span></div>
  <div><small>มูลค่า</small><span class="n">${usd(r.val)}</span></div>
  <div class="pl ${cls(r.pl)}"><small>กำไร/ขาดทุน</small><span class="n">${pct(r.plp)}</span><small class="${cls(r.pl)}">${sgn(r.pl)}</small></div>
  <div class="acts"><button class="ghost" data-a="det" data-s="${s}">${o?'ซ่อน ▴':'รายละเอียด ▾'}</button><button class="pri" data-a="avg" data-s="${s}">ถัว</button></div></div>`
  :`<div class="row"><div><div class="sym">${s}</div><small>ขายหมดแล้ว</small></div><div></div><div></div><div></div><div class="pl ${cls(r.realized)}"><small>กำไรที่ขายแล้ว</small><span class="n">${sgn(r.realized)}</span></div><div class="acts"><button class="ghost" data-a="det" data-s="${s}">${o?'ซ่อน ▴':'ประวัติ ▾'}</button></div></div>`;
  const det=o?`<div class="det"><div class="scroll"><table class="stack"><thead><tr><th>วันที่</th><th>ประเภท</th><th class="r">จำนวน</th><th class="r">ราคา</th><th class="r">ค่าธรรมเนียม</th><th class="r">ยอดเงิน</th><th class="r">${settings.method==='fifo'?'ล็อตคงเหลือ / กำไรที่ขาย':'กำไรที่ขาย'}</th><th></th></tr></thead><tbody>
  ${[...r.tx].reverse().map(x=>{const a=ann[x.id]||{},b=x.type==='buy',amt=b?x.qty*x.price+(+x.fee||0):x.qty*x.price-(+x.fee||0);
  const info=b?(a.pooled?'':`${qf(a.remain)} / ${qf(a.q0)}`):`<span class="${cls(a.realized)}">${sgn(a.realized)}</span>${a.over?' <span class="err">ขายเกินจำนวนที่มี</span>':''}`;
  return`<tr><td>${esc(x.date)}</td><td><span class="tag ${b?'b':'s'}">${b?'ซื้อ':'ขาย'}</span></td><td class="r n">${qf(+x.qty)}</td><td class="r n">${usd(+x.price,4)}</td><td class="r n">${+x.fee?usd(+x.fee):'—'}</td><td class="r n">${usd(amt)}${x.cur==='THB'&&+x.fx>0?`<br><small style="color:var(--mut)">฿${(amt*x.fx).toLocaleString('en-US',{maximumFractionDigits:2})} @${esc(x.fx)}</small>`:''}</td><td class="r n">${info}</td><td class="r"><button class="lnk" data-a="edit" data-id="${esc(x.id)}">แก้</button></td></tr>`}).join('')}
  </tbody></table></div><div class="mf"><button class="ghost" data-a="add" data-s="${s}">+ เพิ่มรายการ ${s}</button></div></div>`:'';
  return`<div class="slip">${head}${det}</div>`;
}

/* modal */
const ov=$('#ov'),md=$('#md');
const show=(h,wide)=>{md.className='md'+(wide?' wide':'');md.innerHTML=h;ov.classList.add('on');md.querySelector('input,button')?.focus()};
const hide=()=>{ov.classList.remove('on');md.innerHTML=''};
ov.addEventListener('click',e=>{if(e.target===ov)hide()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')hide()});

function txForm(x={},pre={}){
  const v={sym:'',type:'buy',date:today(),qty:'',price:'',fee:'',cur:'USD',...pre,...x};
  const curFx=+prices.fx?.v;let cur=v.cur==='THB'?'THB':'USD';
  const rate0=+v.fx>0?+v.fx:(isFinite(curFx)?curFx:'');
  const pv=cur==='THB'?(v.priceThb??''):v.price,fv=cur==='THB'?(v.feeThb??''):v.fee;
  show(`<h3>${x.id?'แก้รายการ':'บันทึกรายการซื้อ/ขาย'}</h3><form id="tf"><div class="f">
  <div><label for="fs">หุ้น (ticker)</label><input id="fs" value="${esc(v.sym)}" placeholder="เช่น AAPL" required autocapitalize="characters"></div>
  <div><label>ประเภท</label><div class="seg" id="fty"><button type="button" data-t="buy" class="${v.type==='buy'?'on':''}">ซื้อ</button><button type="button" data-t="sell" class="${v.type==='sell'?'on':''}">ขาย</button></div></div>
  <div><label for="fd">วันที่</label><input id="fd" type="date" value="${esc(v.date)}" required></div>
  <div><label for="fq">จำนวนหุ้น</label><input id="fq" inputmode="decimal" value="${esc(v.qty)}" placeholder="0.5" required></div>
  <div><label>สกุลเงินที่กรอก</label><div class="seg" id="fcur"><button type="button" data-c="USD" class="${cur==='USD'?'on':''}">USD $</button><button type="button" data-c="THB" class="${cur==='THB'?'on':''}">บาท ฿</button></div></div>
  <div id="frw" ${cur==='THB'?'':'hidden'}><label for="frt">เรต (บาท ต่อ 1 USD)</label><input id="frt" inputmode="decimal" value="${esc(rate0)}" placeholder="เช่น 34.10"></div>
  <div><label for="fp" id="fpl"></label><input id="fp" inputmode="decimal" value="${esc(pv)}" placeholder="0.00" required></div>
  <div><label for="ff" id="ffl"></label><input id="ff" inputmode="decimal" value="${esc(fv)}" placeholder="0"></div>
  </div><p class="note" id="fsum"></p><p class="err" id="fer"></p><div class="mf">${x.id?'<button type="button" class="ghost" id="fdel" style="margin-inline-end:auto;color:var(--dn)">ลบรายการ</button>':''}<button type="button" class="ghost" id="fx">ยกเลิก</button><button class="pri">บันทึก</button></div></form>`);
  let type=v.type;
  const lab=()=>{const u=cur==='THB'?'บาท':'USD';$('#fpl').textContent=`ราคาต่อหุ้น (${u})`;$('#ffl').textContent=`ค่าธรรมเนียม (${u}, ถ้ามี)`;$('#frw').hidden=cur!=='THB'};
  const vals=()=>{const q=num($('#fq').value),pIn=num($('#fp').value),fIn=num($('#ff').value)||0,rt=num($('#frt').value);

let pdfLib=null;
const loadJs=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('โหลดตัวอ่าน PDF ไม่สำเร็จ'));document.head.appendChild(s)});
async function getPdf(){if(pdfLib)return pdfLib;const b='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';await loadJs(b+'pdf.worker.min.js');await loadJs(b+'pdf.min.js');pdfLib=window.pdfjsLib;pdfLib.GlobalWorkerOptions.workerSrc=b+'pdf.worker.min.js';return pdfLib}
async function pdfText(file){
  const lib=await getPdf(),task=lib.getDocument({data:new Uint8Array(await file.arrayBuffer())});
  task.onPassword=async(update,reason)=>{const pw=await askPdfPw(file.name,reason===2);if(pw===null){task.destroy()}else{show(`<h3>กำลังอ่าน ${esc(file.name)}</h3><p class="note">ปลดล็อกและดึงข้อความ…</p>`);update(pw)}};
  let d;try{d=await task.promise}catch(err){if(task.destroyed||/destroy|Worker was terminated/i.test(err?.message||''))throw{cancel:true};throw err}
  const all=[];
  for(let i=1;i<=d.numPages;i++){const c=await (await d.getPage(i)).getTextContent();let y=null,line=[];
    for(const it of c.items){const yy=Math.round(it.transform[5]);if(y!==null&&Math.abs(yy-y)>2){all.push(line.join(' '));line=[]}y=yy;if(it.str.trim())line.push(it.str.trim())}all.push(line.join(' '))}
  return all.filter(Boolean);
}
function askPdfPw(name,wrong){return new Promise(res=>{

/* Dime! Confirmation Note parser (Order History table).
   Row: OrderID  SettleDate  BUY|SELL|REW  SYMBOL [EXCH]  Unit  UnitPrice  USD  Gross  FeeInclVat  WHT  Total
   Unit price on the note is rounded to 2 dp, so price = Gross / Unit. Trade date = Effective Date. */
function parseDime(lines){
  const full=lines.join(' ').replace(/\s+/g,' ');
  if(!/Dime|Confirmation Note|Order History/i.test(full))return[];
  const dmy=s=>{const m=s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);return m?ymd(+m[3],+m[2],+m[1]):''};
  const eff=full.match(/Effective\s*Date\s*(?:\S+\s*){0,6}?(\d{1,2}\/\d{1,2}\/\d{4})/i);
  const N='(\\d[\\d,]*(?:\\.\\d+)?)';
  const re=new RegExp(`(\\d{4,})\\s+(\\d{1,2}\\/\\d{1,2}\\/\\d{4})\\s+(BUY|SELL|REW)\\s+([A-Z][A-Z0-9.\\-]{0,9})\\s+(?:\\[[A-Z]+\\]\\s+)?${N}\\s+${N}\\s+USD\\s+${N}\\s+${N}\\s+${N}\\s+${N}`,'g');
  const out=[],seen=new Set();let m;
  while((m=re.exec(full))){
    const [,id,settle,tp,sym]=m,[q,up,gross,fee]=m.slice(5,9).map(x=>+x.replace(/,/g,''));
    if(seen.has(id)||!(q>0))continue;seen.add(id);
    out.push({sym,type:tp==='SELL'?'sell':'buy',date:(eff&&dmy(eff[1]))||dmy(settle),qty:q,price:gross>0?+(gross/q).toFixed(6):up,fee,ref:'DIME-'+id,note:tp==='REW'?'หุ้นรางวัล':''});
  }
  return out;
}
/* Generic trade-line parser. TODO: replace with a Dime-specific parser once a sample statement is available. */
const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12,'ม.ค.':1,'ก.พ.':2,'มี.ค.':3,'เม.ย.':4,'พ.ค.':5,'มิ.ย.':6,'ก.ค.':7,'ส.ค.':8,'ก.ย.':9,'ต.ค.':10,'พ.ย.':11,'ธ.ค.':12};
const STOP=new Set(['BUY','SELL','BOUGHT','SOLD','USD','THB','FEE','VAT','TOTAL','DATE','TIME','PRICE','QTY','AMOUNT','MARKET','LIMIT','ORDER','FILLED','US','ETF','NET','SEC','TAF','AM','PM','ID','NO','TYPE','STATUS','DIME']);
function parseDate(s){
  let m=s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return ymd(+m[1],+m[2],+m[3]);
  m=s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m)return ymd(+m[3],+m[2],+m[1]);
  m=s.match(/(\d{1,2})\s+([A-Za-z]{3})[a-z]*\.?,?\s+(\d{4})/);if(m&&MON[m[2].toLowerCase()])return ymd(+m[3],MON[m[2].toLowerCase()],+m[1]);
  m=s.match(/([A-Za-z]{3})[a-z]*\.?\s+(\d{1,2}),?\s+(\d{4})/);if(m&&MON[m[1].toLowerCase()])return ymd(+m[3],MON[m[1].toLowerCase()],+m[2]);
  m=s.match(/(\d{1,2})\s*(ม\.ค\.|ก\.พ\.|มี\.ค\.|เม\.ย\.|พ\.ค\.|มิ\.ย\.|ก\.ค\.|ส\.ค\.|ก\.ย\.|ต\.ค\.|พ\.ย\.|ธ\.ค\.)\s*(\d{2,4})/);if(m){let y=+m[3];if(y<100)y+=2500;if(y>2400)y-=543;return ymd(y,MON[m[2]],+m[1])}
  return '';
}
function ymd(y,mo,d){if(y<100)y+=2000;if(y>2400)y-=543;if(mo<1||mo>12||d<1||d>31)return'';return`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
function parseTrades(lines){
  const out=[];let lastDate='';
  for(const raw of lines){
    const dt=parseDate(raw);if(dt)lastDate=dt;
    const tm=raw.match(/\b(buy|bought|sell|sold)\b|ซื้อ|ขาย/i);if(!tm)continue;
    const type=/sell|sold|ขาย/i.test(tm[0])?'sell':'buy';
    const sym=(raw.match(/\b[A-Z]{1,5}(?:\.[A-Z])?\b/g)||[]).find(t=>!STOP.has(t));if(!sym)continue;
    const clean=raw.replace(/\d{4}-\d{1,2}-\d{1,2}|\d{1,2}\/\d{1,2}\/\d{4}|\d{1,2}:\d{2}(:\d{2})?/g,' ');
    const nums=(clean.match(/\d[\d,]*\.?\d*/g)||[]).map(x=>+x.replace(/,/g,'')).filter(x=>x>0);
    if(nums.length<2)continue;
    let qty=nums[0],price=nums[1];
    find:for(let i=0;i<nums.length;i++)for(let j=i+1;j<nums.length;j++){const p=nums[i]*nums[j];if(nums.some((k,x)=>x!==i&&x!==j&&Math.abs(k-p)/p<0.012)){qty=nums[i];price=nums[j];break find}}
    out.push({sym,type,date:dt||lastDate,qty,price,fee:0});
  }
  return out;
}

    if(!list.length){show(`<h3>ยังแยกรายการจากไฟล์นี้ไม่ได้</h3><p>ตัวอ่านตอนนี้เป็นแบบทั่วไป ยังไม่รู้จักรูปแบบ statement นี้ ส่งตัวอย่างไฟล์ (ปิดเลขบัญชี) ให้ปรับตัวอ่านได้</p>${raw}<div class="mf"><button class="pri" id="c0">ตกลง</button></div>`,true);$('#c0').onclick=hide;return}
    const cell=(i,k,v,w)=>`<input data-i="${i}" data-k="${k}" value="${esc(v)}" style="min-height:36px;padding:0 6px;font-size:14px;width:${w}">`;
    show(`<h3>พบ ${list.length} รายการ · ตรวจและแก้ก่อนบันทึก</h3><p class="note">${isDime?'อ่านจากใบยืนยันการซื้อขายของ Dime · ราคาต่อหุ้นคิดจากยอดเงิน ÷ จำนวนหุ้น · ค่าธรรมเนียมรวม VAT แล้ว':'ตัวอ่านแบบทั่วไปอาจสลับจำนวนกับราคา ตรวจกับ statement ทุกแถว'} · รายการที่ซ้ำกับของเดิมจะไม่ถูกติ๊ก</p>
    <div class="scroll"><table><thead><tr><th></th><th>วันที่</th><th>หุ้น</th><th>ประเภท</th><th>จำนวน</th><th>ราคา</th><th>ค่าธรรมเนียม</th></tr></thead><tbody>
    ${list.map((t,i)=>`<tr><td><input type="checkbox" data-c="${i}" ${dup(t)?'':'checked'} style="width:22px;min-height:22px"></td><td>${cell(i,'date',t.date,'118px')}</td><td>${cell(i,'sym',t.sym,'70px')}</td><td><select data-i="${i}" data-k="type" style="min-height:36px;width:80px"><option value="buy" ${t.type==='buy'?'selected':''}>ซื้อ</option><option value="sell" ${t.type==='sell'?'selected':''}>ขาย</option></select></td><td>${cell(i,'qty',t.qty,'90px')}</td><td>${cell(i,'price',t.price,'90px')}</td><td>${cell(i,'fee',t.fee,'70px')}</td></tr>`).join('')}
    </tbody></table></div>${raw}<p class="err" id="ier"></p><div class="mf"><button class="ghost" id="i0">ยกเลิก</button><button class="pri" id="i1">บันทึกรายการที่เลือก</button></div>`,true);
    $('#i0').onclick=hide;
    $('#i1').onclick=async ev=>{
      const rows=[];
      for(const c of md.querySelectorAll('input[data-c]:checked')){const i=c.dataset.c,g=k=>md.querySelector(`[data-i="${i}"][data-k="${k}"]`).value;
        const t={sym:g('sym').trim().toUpperCase(),type:g('type'),date:g('date').trim(),qty:num(g('qty')),price:num(g('price')),fee:num(g('fee'))||0,cur:'USD',...(list[i].ref?{ref:list[i].ref}:{})};
        if(!t.sym||!/^\d{4}-\d\d-\d\d$/.test(t.date)||!(t.qty>0)||!(t.price>=0)){$('#ier').textContent=`แถวที่ ${+i+1} ข้อมูลไม่ครบ (วันที่ต้องเป็น YYYY-MM-DD)`;return}rows.push(t)}
      ev.target.disabled=true;
      try{await saveMany(rows.map((t,n)=>({...t,t:Date.now()+n,src:'pdf:'+file.name.slice(0,80)})));rows.forEach(t=>open.add(t.sym));hide()}catch(err){$('#ier').textContent=errMsg(err);ev.target.disabled=false}};
  }catch(err){if(err?.cancel){hide();return}show(`<h3>อ่านไฟล์ไม่สำเร็จ</h3><p>${esc(err?.message||'เกิดข้อผิดพลาด')}</p><div class="mf"><button class="pri" id="c0">ตกลง</button></div>`);$('#c0').onclick=hide}
};

/* JSON backup */
function exportJson(){
  const data={app:'us-portfolio',version:1,exportedAt:new Date().toISOString(),settings,txns:txns.map(({id,sym,type,date,qty,price,fee,t,src,cur,fx,priceThb,feeThb,ref})=>({id,sym,type,date,qty,price,fee,t,src,ref:ref||null,cur:cur||'USD',...(cur==='THB'?{fx,priceThb,feeThb}:{})}))};
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download=`portfolio-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}
$('#jsonIn').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const d=JSON.parse(await f.text());const list=(Array.isArray(d)?d:d.txns||[]).map(x=>({sym:String(x.sym||'').toUpperCase(),type:x.type==='sell'?'sell':'buy',date:String(x.date||''),qty:num(x.qty),price:num(x.price),fee:num(x.fee)||0,t:+x.t||Date.now(),src:x.src||'json',id:x.id,cur:x.cur==='THB'?'THB':'USD',...(x.cur==='THB'&&+x.fx>0?{fx:+x.fx,priceThb:num(x.priceThb),feeThb:num(x.feeThb)||0}:{})})).filter(x=>x.sym&&/^\d{4}-\d\d-\d\d$/.test(x.date)&&x.qty>0&&x.price>0);
    const have=new Set(txns.map(x=>x.id)),fresh=list.filter(x=>!x.id||!have.has(x.id));
    await saveMany(fresh);if(d.settings?.method)await setDoc(doc(fs,`users/${uid}/meta/settings`),{method:d.settings.method==='avg'?'avg':'fifo'});
    show(`<h3>นำเข้าเรียบร้อย</h3><p>เพิ่ม ${fresh.length} รายการ${list.length-fresh.length?` (ข้าม ${list.length-fresh.length} รายการที่มีอยู่แล้ว)`:''}</p><div class="mf"><button class="pri" id="c0">ตกลง</button></div>`);$('#c0').onclick=hide;
  }catch(err){show(`<h3>นำเข้าไม่สำเร็จ</h3><p>${esc(err?.message||errMsg(err))}</p><div class="mf"><button class="pri" id="c0">ตกลง</button></div>`);$('#c0').onclick=hide}
};

/* storage */
const errMsg=e=>e?.code==='permission-denied'?'ไม่มีสิทธิ์บันทึก ตรวจ Firestore Rules หรืออีเมลที่อนุญาต':e?.code==='unavailable'?'เชื่อมต่อไม่ได้ ลองอีกครั้ง':'บันทึกไม่สำเร็จ: '+(e?.message||'');
const txCol=()=>collection(fs,`users/${uid}/txns`);
async function save(id,d){const ref=id?doc(txCol(),id):doc(txCol());await setDoc(ref,{...d,id:ref.id})}
async function saveMany(list){for(let i=0;i<list.length;i+=400){const b=writeBatch(fs);for(const x of list.slice(i,i+400)){const ref=x.id?doc(txCol(),x.id):doc(txCol());b.set(ref,{...x,id:ref.id})}await b.commit()}}
async function del(id){await deleteDoc(doc(txCol(),id))}
async function saveOvr(o){ovr=o;mergePrices();render();await setDoc(doc(fs,`users/${uid}/meta/overrides`),o)}
const newer=(a,b)=>!a?b:!b?a:(a.at||'')>=(b.at||'')?a:b;
function mergePrices(){
  const p={};for(const s of new Set([...Object.keys(autoP),...Object.keys(ovr.p||{})]))p[s]=newer(autoP[s],ovr.p?.[s]);
  const ats=Object.values(autoP).map(x=>x.at||'').sort();
  prices={p,fx:newer(autoFx,ovr.fx),at:ats[ats.length-1]||''};
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||md.contains(b))return;const s=b.dataset.s,a=b.dataset.a;
  if(a==='det'){open.has(s)?open.delete(s):open.add(s);render()}
  else if(a==='avg')avgModal(s);else if(a==='px')pxModal(s);else if(a==='add')txForm({},s?{sym:s}:{});
  else if(a==='edit'){const x=txns.find(z=>z.id===b.dataset.id);if(x)txForm(x)}
});
$('#bAdd').onclick=()=>txForm();
document.addEventListener('submit',async e=>{
  if(e.target.id!=='login')return;e.preventDefault();
  const u=$('#lu').value.trim().toLowerCase(),btn=e.target.querySelector('button');
  const email=u.includes('@')?u:u+'@dime.com';
  btn.disabled=true;$('#ler').textContent='';
  try{await signInWithEmailAndPassword(auth,email,$('#lp').value)}
  catch(err){const c=err?.code||'';$('#ler').textContent=c.includes('too-many')?'ลองผิดหลายครั้งเกินไป รอสักครู่แล้วลองใหม่':c.includes('network')?'เชื่อมต่อไม่ได้ ตรวจอินเทอร์เน็ต':'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง';btn.disabled=false}
});$('#bSet').onclick=setModal;

/* boot */
let unsubs=[];
const app=initializeApp(firebaseConfig),auth=getAuth(app);fs=getFirestore(app);
onAuthStateChanged(auth,u=>{
  unsubs.forEach(f=>f());unsubs=[];txns=[];autoP={};autoFx=null;ovr={p:{},fx:null};settings={method:'fifo'};mergePrices();
  uid=u?.uid||null;$('#topActs').hidden=!u;
  if(!u){ready=false;render();$('#stamp').textContent='ล็อกอินเพื่อดูพอร์ตของคุณ';$('#list').innerHTML=`<form id="login" class="slip" style="max-width:380px;margin:0 auto;padding:22px"><h2 style="margin:0 0 14px">เข้าสู่ระบบ</h2><label class="note" for="lu">ชื่อผู้ใช้</label><input id="lu" autocomplete="username" autocapitalize="none" spellcheck="false" required><label class="note" for="lp" style="display:block;margin-top:10px">รหัสผ่าน</label><input id="lp" type="password" autocomplete="current-password" required><p class="err" id="ler"></p><button class="pri" style="width:100%">เข้าสู่ระบบ</button></form>`;return}
  ready=false;render();
  const fail=err=>{ready=true;render();$('#stamp').textContent=errMsg(err)};
  unsubs.push(onSnapshot(txCol(),s=>{txns=s.docs.map(d=>({...d.data(),id:d.id})).filter(x=>x.sym&&+x.qty>0);ready=true;render()},fail));
  unsubs.push(onSnapshot(collection(fs,'prices'),s=>{autoP={};s.docs.forEach(d=>{const v=d.data();if(isFinite(+v.v))autoP[d.id]={...v,src:'auto'}});mergePrices();render()},fail));
  unsubs.push(onSnapshot(doc(fs,'fx/USDTHB'),s=>{autoFx=s.exists()?{...s.data(),src:'auto'}:null;mergePrices();render()},fail));
  unsubs.push(onSnapshot(doc(fs,`users/${uid}/meta/overrides`),s=>{ovr=s.exists()?{p:{},...s.data()}:{p:{},fx:null};mergePrices();render()},fail));
  unsubs.push(onSnapshot(doc(fs,`users/${uid}/meta/settings`),s=>{if(s.exists())settings={method:'fifo',...s.data()};render()},fail));
});
}
</script>
</body>
